openapi: 3.0.0
info:
  title: CrossFit Accessory Planner API
  description: CrossFit 보조 운동 계획 생성 및 운동 기록 관리 API
  version: 1.0.0
  contact:
    name: CrossFit Planner Team
  license:
    name: MIT

servers:
  - url: https://api.crossfit-planner.com/api/v1
    description: 프로덕션 서버
  - url: http://localhost:8080/api/v1
    description: 개발 서버

tags:
  - name: 인증
    description: 사용자 인증 관련 API
  - name: 사용자
    description: 사용자 정보 조회 및 관리
  - name: 운동 계획
    description: 운동 계획 생성 및 조회
  - name: 운동 기록
    description: 운동 기록 저장 및 조회

paths:
  /oauth2/authorization/google:
    get:
      tags:
        - 인증
      summary: Google OAuth 인증 시작
      description: Google을 통한 OAuth 인증을 시작합니다. Google 로그인 후 자동으로 리다이렉트되며 refreshToken이 쿼리 파라미터로 전달됩니다.
      parameters:
        - name: redirect_uri
          in: query
          description: Google 인증 후 리다이렉트될 클라이언트 URI (선택사항)
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Google 로그인 페이지로 리다이렉트
        '200':
          description: Google 인증 성공 후 클라이언트로 리다이렉트 (refreshToken 포함)
          content:
            text/html:
              example: 'HTTP/302 Location: {redirect_uri}?refreshToken={refreshToken}'

  /auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      description: 사용자 로그아웃
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /auth-token/refresh:
    post:
      tags:
        - 인증
      summary: 토큰 갱신
      description: 리프레시 토큰을 이용하여 새로운 액세스 토큰 및 리프레시 토큰 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 리프레시 토큰
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          description: 토큰 갱신 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /users/profile:
    get:
      tags:
        - 사용자
      summary: 사용자 프로필 조회
      description: 현재 로그인한 사용자의 프로필 정보 조회
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /users/stats:
    get:
      tags:
        - 사용자
      summary: 사용자 통계 조회
      description: 사용자의 운동 통계 정보 조회
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          description: 통계 기간 (month, quarter, year)
          schema:
            type: string
            enum: [month, quarter, year]
            default: month
      responses:
        '200':
          description: 통계 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /movements:
    get:
      tags:
        - 운동 계획
      summary: 운동 목록 조회
      description: 전체 CrossFit 운동 목록 조회 (검색 지원)
      parameters:
        - name: keyword
          in: query
          description: 검색 키워드 (한글 또는 초성)
          schema:
            type: string
          example: 스내치
        - name: category
          in: query
          description: 운동 카테고리 (쉼표로 구분)
          schema:
            type: string
          example: olympic,strength
      responses:
        '200':
          description: 운동 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementListResponse'

  /movements/frequent:
    get:
      tags:
        - 운동 계획
      summary: 자주 나오는 운동 조회
      description: WOD에서 자주 나오는 운동 목록 조회
      responses:
        '200':
          description: 자주 나오는 운동 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequentMovementsResponse'

  /movements/goals:
    get:
      tags:
        - 운동 계획
      summary: 달성 목표 운동 목록 조회
      description: 스킬 달성 목표 운동 목록 조회
      responses:
        '200':
          description: 달성 목표 운동 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsListResponse'

  /workouts/generate:
    post:
      tags:
        - 운동 계획
      summary: 운동 계획 생성
      description: 사용자의 입력(WOD/목표/타겟부위)을 기반으로 운동 계획 생성
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutGenerateRequest'
      responses:
        '200':
          description: 운동 계획 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutGenerateResponse'
        '400':
          description: 요청 데이터 유효성 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /workouts/records:
    get:
      tags:
        - 운동 기록
      summary: 운동 기록 조회
      description: |
        사용자의 운동 기록 조회
        - date 파라미터: 특정 날짜의 기록 조회
        - year, month 파라미터: 특정 월의 기록 및 캘린더 데이터 조회
        - startDate, endDate: 날짜 범위로 기록 조회
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          description: 조회할 특정 날짜 (YYYY-MM-DD) - 이 파라미터 사용 시 해당 날짜 기록 반환
          schema:
            type: string
            format: date
        - name: year
          in: query
          description: 조회할 연도 (year, month 함께 사용 시 월별 캘린더 데이터 반환)
          schema:
            type: integer
            example: 2024
        - name: month
          in: query
          description: 조회할 월 (1-12, year와 함께 사용)
          schema:
            type: integer
            example: 1
        - name: startDate
          in: query
          description: 시작 날짜 (YYYY-MM-DD) - 범위 조회 시 사용
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 종료 날짜 (YYYY-MM-DD) - 범위 조회 시 사용
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: 조회 결과 개수 제한
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 운동 기록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutHistoryResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'
    post:
      tags:
        - 운동 기록
      summary: 운동 기록 저장
      description: 완료된 운동을 기록으로 저장
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkoutRecordRequest'
      responses:
        '201':
          description: 운동 기록 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveWorkoutRecordResponse'
        '400':
          description: 요청 데이터 유효성 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequestResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

  /workouts/records/{recordId}:
    delete:
      tags:
        - 운동 기록
      summary: 운동 기록 삭제
      description: 저장된 운동 기록 삭제
      security:
        - BearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          description: 운동 기록 ID
          schema:
            type: string
      responses:
        '200':
          description: 운동 기록 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '404':
          description: 운동 기록을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFoundResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorizedResponse'

components:
  schemas:
    CommonResult:
      type: object
      description: 모든 API 응답의 공통 포맷
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: 요청 성공 여부
        message:
          type: string
          description: 응답 메시지
        data:
          type: object
          description: 실제 응답 데이터 (실패 시 에러 정보, 성공 시 비즈니스 데이터)
          nullable: true

    # 응답 스키마들
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
      example:
        success: true
        message: 요청이 성공했습니다.
        data: null

    ErrorUnauthorizedResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
      example:
        success: false
        message: 인증 실패
        data: null

    ErrorBadRequestResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
      example:
        success: false
        message: 요청 데이터가 유효하지 않습니다.
        data: null

    ErrorNotFoundResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
      example:
        success: false
        message: 요청한 리소스를 찾을 수 없습니다.
        data: null

    TokenRefreshResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'
      example:
        success: true
        message: 토큰 갱신 성공
        data:
          accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          accessTokenExpiresInSec: 3600
          refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          refreshTokenExpiresInSec: 604800

    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'
      example:
        success: true
        message: 프로필 조회 성공
        data:
          id: user123
          name: 김크로스핏
          email: crossfitter@gmail.com
          googleId: google123
          profileImage: https://example.com/profile.jpg
          createdAt: '2024-01-01T00:00:00Z'
          exerciseCountThisMonth: 12

    UserStatsResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserStats'
      example:
        success: true
        message: 통계 조회 성공
        data:
          totalCount: 24
          averageTime: 18.5
          mostUsedMode: wod
          favoriteExercises: [스내치, 풀업, 플랭크]

    MovementListResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MovementList'
      example:
        success: true
        message: 운동 목록 조회 성공
        data:
          movements:
            - id: mov1
              name: 할로우 락
              category: gymnastics
              muscleGroups: [core]
              equipment: [맨몸]
              difficulty: beginner
          total: 25

    FrequentMovementsResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FrequentMovements'
      example:
        success: true
        message: 자주 나오는 운동 조회 성공
        data:
          movements: [스내치, 클린, 풀업, 로잉, 더블언더, 월워크, 박스점프, 버피]

    GoalsListResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GoalsList'
      example:
        success: true
        message: 달성 목표 운동 목록 조회 성공
        data:
          goals: [키핑 풀업, 스트릭 풀업, 버터플라이 풀업, 토투바, 체스트 투 바, 바 머슬업, 링 머슬업, 핸드스탠드 워크]

    WorkoutGenerateResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkoutPlan'
      example:
        success: true
        message: 운동 계획이 생성되었습니다.
        data:
          id: plan123
          mode: wod
          duration: 20
          rounds: 6
          targetTimePerRound: 3분 20초
          exercises:
            - id: ex1
              name: 할로우 락
              reps: 10-15 reps
              equipment: [맨몸]
          modeDisplay: 부족 부위 채우기
          createdAt: '2024-01-15T10:30:00Z'

    WorkoutHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkoutHistory'
      example:
        success: true
        message: 운동 기록 조회 성공
        data:
          year: 2024
          month: 1
          records:
            - id: rec1
              userId: user123
              date: '2024-01-15'
              mode: wod
              duration: 20
              exercises: [할로우 락, 플랭크]
              modeDisplay: 부족 부위 채우기
          calendarData:
            - date: '2024-01-15'
              hasRecord: true

    SaveWorkoutRecordResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkoutRecord'
      example:
        success: true
        message: 운동 기록이 저장되었습니다.
        data:
          id: rec123
          userId: user123
          date: '2024-01-15'
          mode: wod
          duration: 20
          exercises: [할로우 락, 플랭크]
          modeDisplay: 부족 부위 채우기

    # 데이터 스키마들
    TokenPair:
      type: object
      description: 액세스 토큰과 리프레시 토큰 쌍
      required:
        - accessToken
        - accessTokenExpiresInSec
        - refreshToken
        - refreshTokenExpiresInSec
      properties:
        accessToken:
          type: string
          description: JWT 액세스 토큰
        accessTokenExpiresInSec:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간 (초 단위)
        refreshToken:
          type: string
          description: JWT 리프레시 토큰
        refreshTokenExpiresInSec:
          type: integer
          format: int64
          description: 리프레시 토큰 만료 시간 (초 단위)

    UserProfile:
      type: object
      description: 사용자 프로필 정보
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: 사용자 ID
        name:
          type: string
          description: 사용자 이름
        email:
          type: string
          description: 이메일 주소
        googleId:
          type: string
          description: Google 계정 ID
        profileImage:
          type: string
          format: uri
          description: 프로필 이미지 URL
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 시간
        exerciseCountThisMonth:
          type: integer
          description: 이번 달 운동 횟수

    UserStats:
      type: object
      description: 사용자 운동 통계
      required:
        - totalCount
        - averageTime
      properties:
        totalCount:
          type: integer
          description: 총 운동 횟수
        averageTime:
          type: number
          format: double
          description: 평균 운동 시간 (분)
        mostUsedMode:
          type: string
          enum: [wod, goal, part]
          description: 가장 많이 사용한 모드
        favoriteExercises:
          type: array
          items:
            type: string
          description: 즐겨 하는 운동 목록

    User:
      type: object
      properties:
        id:
          type: string
          description: 사용자 ID
        name:
          type: string
          description: 사용자 이름
        email:
          type: string
          description: 이메일 주소
        googleId:
          type: string
          description: Google 계정 ID
        profileImage:
          type: string
          format: uri
          description: 프로필 이미지 URL
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 시간
        updatedAt:
          type: string
          format: date-time
          description: 계정 수정 시간

    Movement:
      type: object
      properties:
        id:
          type: string
          description: 운동 ID
        name:
          type: string
          description: 운동 이름
        category:
          type: string
          enum: [olympic, strength, gymnastics, cardio, monostructural]
          description: 운동 카테고리
        muscleGroups:
          type: array
          items:
            type: string
            enum: [core, legs, back, chest, shoulder, arms, cardio, full]
          description: 타겟 근육 그룹
        equipment:
          type: array
          items:
            type: string
          description: 필요한 장비
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
          description: 난이도

    MovementList:
      type: object
      description: 운동 목록 조회 결과
      required:
        - movements
        - total
      properties:
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
          description: 운동 목록
        total:
          type: integer
          description: 전체 운동 개수

    FrequentMovements:
      type: object
      description: 자주 나오는 운동 목록
      required:
        - movements
      properties:
        movements:
          type: array
          items:
            type: string
          description: 자주 나오는 운동 이름 목록

    GoalsList:
      type: object
      description: 달성 목표 운동 목록
      required:
        - goals
      properties:
        goals:
          type: array
          items:
            type: string
          description: 달성 목표 운동 이름 목록

    WorkoutGenerateRequest:
      type: object
      required:
        - mode
        - duration
      properties:
        mode:
          type: string
          enum: [wod, goal, part]
          description: |
            운동 계획 생성 모드
            - wod: 부족한 부위 채우기 (오늘 한 WOD 기반)
            - goal: 나의 달성 목표 (스킬 기반)
            - part: 타겟 부위 선택 (부위 집중 공략)
        duration:
          type: integer
          enum: [10, 15, 20, 25, 30]
          description: 운동 시간 (분)
        wodMovements:
          type: array
          items:
            type: string
          description: WOD 모드일 때, 오늘 수행한 운동 목록
        goalMovement:
          type: string
          description: goal 모드일 때, 달성하고 싶은 스킬
        targetMuscleGroups:
          type: array
          items:
            type: string
            enum: [core, legs, back, chest, shoulder, cardio]
          description: part 모드일 때, 타겟 근육 그룹

    WorkoutPlan:
      type: object
      description: 생성된 운동 계획
      required:
        - id
        - mode
        - duration
        - rounds
        - exercises
      properties:
        id:
          type: string
          description: 운동 계획 ID
        mode:
          type: string
          enum: [wod, goal, part]
        duration:
          type: integer
          description: 운동 시간 (분)
        rounds:
          type: integer
          description: 라운드 수
        targetTimePerRound:
          type: string
          description: 라운드당 목표 시간
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
          description: 운동 목록
        modeDisplay:
          type: string
          description: 모드 표시 텍스트
        createdAt:
          type: string
          format: date-time

    Exercise:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          description: 운동 이름
        reps:
          type: string
          description: 추천 반복 횟수
        equipment:
          type: array
          items:
            type: string
          description: 필요 장비
        muscleGroups:
          type: array
          items:
            type: string
          description: 타겟 근육 그룹

    WorkoutHistory:
      type: object
      description: 운동 기록 조회 결과
      required:
        - records
      properties:
        year:
          type: integer
          description: 조회한 연도
        month:
          type: integer
          description: 조회한 월
        records:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutRecord'
          description: 운동 기록 목록
        calendarData:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
          description: 월별 캘린더 데이터

    CalendarDay:
      type: object
      description: 캘린더 날짜 정보
      required:
        - date
        - hasRecord
      properties:
        date:
          type: string
          format: date
        hasRecord:
          type: boolean
          description: 해당 날짜에 운동 기록이 있는지 여부

    SaveWorkoutRecordRequest:
      type: object
      required:
        - workoutPlanId
        - completedAt
      properties:
        workoutPlanId:
          type: string
          description: 운동 계획 ID
        completedAt:
          type: string
          format: date-time
          description: 운동 완료 시간
        notes:
          type: string
          description: 운동 관련 메모
          maxLength: 500

    WorkoutRecord:
      type: object
      description: 운동 기록
      required:
        - id
        - userId
        - date
        - mode
        - duration
        - exercises
      properties:
        id:
          type: string
          description: 기록 ID
        userId:
          type: string
          description: 사용자 ID
        date:
          type: string
          format: date
          description: 운동 날짜
        mode:
          type: string
          enum: [wod, goal, part]
          description: 운동 계획 모드
        duration:
          type: integer
          description: 운동 시간 (분)
        exercises:
          type: array
          items:
            type: string
          description: 운동 목록
        modeDisplay:
          type: string
          description: 모드 표시 텍스트
        notes:
          type: string
          description: 메모
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 기반 인증 (로그인 후 발급받은 accessToken 사용)

security:
  - BearerAuth: []
